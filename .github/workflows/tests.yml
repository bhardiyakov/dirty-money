# Testes do jogo no Chromium (renderização por software, sem placa de vídeo): fumaça, celular, sistemas, todas as lojas,
# longa duração (60 s de jogo por cenário) e primeiros passos. Roda em todo PR e em cada push na main.
# Localmente: node tests/run.cjs (ou --quick). Ver tests/run.cjs.
# (YAML não aceita tab na indentação: este arquivo usa espaços.)
name: Testes do jogo

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04            # (o Playwright 1.56 ainda não suporta o Ubuntu 26.04 do ubuntu-latest)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar o Playwright e o Chromium
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Rodar os testes
        run: node tests/run.cjs --quick
