<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>NPCs — validação do porte do gerador</title>
    <style>
        body { background: #2b2e34; color: #d8dce2; font: 13px system-ui, Segoe UI, Arial, sans-serif; padding: 16px; }
        canvas { image-rendering: pixelated; background: #5c6170; margin: 2px; }
        .row { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; }
        pre { font-size: 12px; }
    </style>
</head>
<body>
    <h3>Porte JS × PNG original (192 px, escala 1,04)</h3>
    <pre id="log">rodando…</pre>
    <div id="out"></div>
    <script src="../../src/art/npcgen/NpcGenCore.js"></script>
    <script src="../../src/art/npcgen/NpcGenChar.js"></script>
    <script src="../../src/art/npcgen/NpcGenRender.js"></script>
    <script src="../../src/art/npcgen/NpcGenAnims.js"></script>
    <script>
        const G = {}; NpcGenCore(G); NpcGenChar(G); NpcGenRender(G); NpcGenAnims(G);
        G.ADULT = null; G.SHADE = 'cel';     // compara com o desenho ORIGINAL do pacote (chibi, 5 tons), não com o do jogo (adulto, sombreado contínuo)
        const DIRS = [['S', 180], ['SW', 135], ['W', 90], ['NW', 45], ['N', 0], ['NE', -45], ['E', -90], ['SE', -135]];
        const log = (s) => { document.getElementById('log').textContent += '\n' + s; };
        const loadImg = (src) => new Promise((ok, err) => { const i = new Image(); i.onload = () => ok(i); i.onerror = err; i.src = src; });

        async function check(cid, anim, frames, dirs) {
            const spec = G.fullSpec(G.BY_ID[cid]);
            G.setRig(G.rigFor(spec)); G.CTX.rifle = spec.rifle;
            let t0 = performance.now();
            const baked = window._baked && window._baked.id === cid ? window._baked.b : G.loadBaked(spec, 0.2);
            window._baked = { id: cid, b: baked };
            const tb = performance.now() - t0;
            let npts = 0; for (const b of Object.values(baked.body)) npts += b.n;
            const R = new G.Renderer(baked, new G.Camera(), { W: 192, H: 192, pivot: [96, 124], charScale: spec.scale });
            const ramps = G.rampsFor(spec);
            const poses = G.ANIMS[anim][0]();
            const ref = await loadImg(`_ref/${cid}_${anim}.png`);
            const rc = document.createElement('canvas'); rc.width = ref.width; rc.height = ref.height;
            const rctx = rc.getContext('2d'); rctx.drawImage(ref, 0, 0);
            const row = document.createElement('div'); row.className = 'row'; document.getElementById('out').appendChild(row);
            let tot = 0, bad = 0, tr = 0, nfr = 0;
            for (const di of dirs) for (const fi of frames) {
                t0 = performance.now();
                const fr = R.render(poses[fi], DIRS[di][1]);
                tr += performance.now() - t0; nfr++;
                const rgba = G.colorize(fr, ramps);
                const refd = rctx.getImageData(fi * 192, di * 192, 192, 192).data;
                let diff = 0;
                const dimg = new ImageData(192, 192);
                for (let i = 0; i < 192 * 192; i++) {
                    const o = i * 4, a = rgba[o + 3], b = refd[o + 3];
                    let d = 0;
                    if ((a > 0) !== (b > 0)) d = 1;
                    else if (a > 0 && (Math.abs(rgba[o] - refd[o]) + Math.abs(rgba[o + 1] - refd[o + 1]) + Math.abs(rgba[o + 2] - refd[o + 2]) > 6 || Math.abs(a - b) > 3)) d = 1;
                    if (d) { diff++; dimg.data[o] = 255; dimg.data[o + 3] = 255; }
                    else if (b) { dimg.data[o] = dimg.data[o + 1] = dimg.data[o + 2] = 90; dimg.data[o + 3] = 255; }
                    if (b || a) tot++;
                }
                bad += diff;
                const mk = (data) => { const c = document.createElement('canvas'); c.width = c.height = 192; c.style.width = c.style.height = '192px'; c.getContext('2d').putImageData(data instanceof ImageData ? data : new ImageData(data, 192, 192), 0, 0); return c; };
                const wrap = document.createElement('div');
                wrap.appendChild(mk(new ImageData(new Uint8ClampedArray(rgba), 192, 192)));
                wrap.appendChild(mk(rctx.getImageData(fi * 192, di * 192, 192, 192)));
                wrap.appendChild(mk(dimg));
                wrap.appendChild(document.createTextNode(`${anim} ${DIRS[di][0]} f${fi}: ${diff} px diferentes`));
                row.appendChild(wrap);
            }
            log(`${cid} ${anim}: ${npts} pontos (assar ${tb.toFixed(0)} ms), render ${(tr / nfr).toFixed(1)} ms/quadro — ${bad} px diferentes de ${tot} (${(100 * bad / Math.max(tot, 1)).toFixed(2)}%)`);
            return { bad, tot };
        }
        (async () => {
            try {
                window.results = [];
                results.push(await check('civil_trabalhador', 'idle', [0, 3], [0, 2, 4, 7]));
                results.push(await check('civil_trabalhador', 'walk', [1, 5], [1, 6]));
                results.push(await check('civil_trabalhador', 'death', [7], [0, 3]));
                results.push(await check('civil_trabalhador', 'swim', [2], [0, 5]));
                results.push(await check('civil_turista', 'idle', [0], [0, 3, 6]));
                results.push(await check('pm_policial', 'pistol_walk', [2], [0, 2, 5]));
                results.push(await check('bope_capacete', 'rifle_shoot', [0, 1], [0, 6]));
                log('FIM');
            } catch (e) { log('ERRO: ' + e.stack); }
        })();
    </script>
</body>
</html>
